apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// ⚠ THE DJI KEY LIVES IN app/dji-key.properties, WHICH IS GITIGNORED.
//
// Copy app/dji-key.properties.example to app/dji-key.properties and fill it in. Without it the
// manifest placeholder is empty and the SDK registration fails with a clear error, which is
// better than a build that silently produces an application no aircraft will talk to.
//
// The AIRCRAFT_API_KEY line in gradle.properties is a fallback and MUST STAY EMPTY. The key was
// committed there until 2026-08-16 — it is still in this repository's history, which is why the
// repository is private. Putting a key back in that file publishes it again.
//
// The key is bound to the applicationId in the DJI developer console.
def djiApiKey = project.hasProperty('AIRCRAFT_API_KEY') ? project.AIRCRAFT_API_KEY : ''
def djiKeyFile = file('dji-key.properties')
if (djiKeyFile.exists()) {
    def p = new Properties()
    djiKeyFile.withInputStream { p.load(it) }
    if (p['AIRCRAFT_API_KEY']) {
        djiApiKey = p['AIRCRAFT_API_KEY']
    }
}

android {
    // Namespace matches the v4 tree package root so ported files keep
    // their package lines and R imports. The app identity is the
    // applicationId below, not the namespace.
    namespace "com.dji.sdk.sample"
    compileSdkVersion Integer.parseInt(project.ANDROID_COMPILE_SDK_VERSION)

    defaultConfig {
        // Do not change. The DJI key is bound to this id.
        applicationId "com.anchortak.takpilot2djiv5"
        minSdkVersion Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        // 2: channels, by the method a TAK server accepts (2026-08-16). Bump this on every
        //    build that goes on a device — it is what lets `install -r` replace the last one.
        // 3: the Autel v1.6.2 Pre-Flight pass, ported via the MSDKv4 sibling's v1.2.0
        //    (2026-08-18) — two video servers, a codec choice, the Pre-Flight rearrangement
        //    and the Field Guide cut.
        // 4: 1.0.0-dev1, the first signed release of this tree (2026-08-18).
        // 5: the registration fix — the permission gate held VIBRATE, which the manifest does
        //    not declare, so the SDK never registered (2026-08-19). First build to register
        //    on an RC Plus 2 and to see the aircraft.
        // 6: two bench crashes on the same day — the flight screen died on a null
        //    description() from a refused metering write, and the Debug screen died because
        //    nothing ever called AppLog.init().
        // 7: the action bar fits the RC Plus 2. Its children totalled about 810dp against
        //    760dp of usable width, so the record toggle was cut off at the screen edge.
        // 8: signal and GPS put their number under the icon, which returned enough width to
        //    keep every action control at full size.
        // 9: the HUD column and map sit against the right edge (paddingEnd 14dp -> 4dp) and
        //    the column is 148dp, so latitude and longitude print on ONE line.
        // 10: the FPV image is pushed to the bottom edge, so the 16:9 letterbox hides behind
        //     the action bar instead of showing as a black band. Translation only, no crop.
        // 11: the warning banner shows the aircraft's faults again. FlightWarnings.reset() ran
        //     after the flight screen seeded them and discarded them, and the change-only
        //     event never fired again.
        // 12-16: the rest of the warning-banner work on 2026-08-19 — de-duplication, the
        //     code-to-English table, worst-first ordering, and tap to expand.
        // 17: the banner no longer raises the fault codes DJI Pilot 2 itself withholds from a
        //     pilot. Measured, not guessed, and every fault is still logged in full.
        // 18: STOP / QUIT fits the home screen without scrolling. It started one pixel above
        //     the fold, so it was unreachable without a scroll.
        // 19: the TAK logo is off the ENTER FLIGHT card, which frees 84dp for information.
        // 20: the Field Guide is 2578 words, cut from 3092. One section removed; its two facts
        //     that change a flight decision moved rather than went.
        // 21: the Field Guide has 3 callout boxes, not 19. Sixteen became prose and NO sentence
        //     was deleted to do it. Boxes are what made it look long, not words.
        // 22: the shutter takes one photo per tap. Three rapid taps ran three overlapping
        //     sequences and two failed with "Photo failed: null" (2026-08-20).
        // 23-25: three wrong theories about the zoom button, each put on the device and each
        //     disproved by a read-back. Kept in the history because the read-back is the only
        //     reason the right answer was found.
        // 26: zoom works. It switches KeyCameraVideoStreamSource to the ZOOM camera; setting
        //     the ratio alone was accepted, held, and invisible.
        // 27: the zoom ladder is the camera's own gears — 1, 3, 7, 14, 28.
        // 28: "Lock battery levels" locks the battery levels, and no longer the stick mode and
        //     the signal-loss behaviour as well.
        versionCode 55
        // Stays -dev until something has flown. NOTHING HAS FLOWN ON MSDKv5 YET, so the number
        // does not move: the channel work is ported from the Autel tree and proved on Autel
        // hardware, which says nothing about this airframe.
        //
        // The -devN suffix counts the DEVELOPMENT releases, which is the only part free to
        // move before a flight. It goes to 1.0.0 when the aircraft has been in the air, and
        // not before — the same rule the MSDKv4 sibling followed from 1.1.0-dev to 1.1.0.
        versionName "1.0.0-dev1"
        buildConfigField "String", "BUILD_TIME",
                "\"${new Date().format('yyyy-MM-dd HH:mm', TimeZone.getTimeZone('UTC'))} UTC\""
        manifestPlaceholders["API_KEY"] = djiApiKey
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    // Release signing comes from app/keystore.properties (gitignored).
    // Without it the release APK builds unsigned. Same flow as the v4 app.
    def keystoreProps = new Properties()
    def keystoreFile = file('keystore.properties')
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        // The DJI native libs must not be stripped. List from the
        // official v5 sample.
        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        // Pure-logic tests only; android.util.Log calls return defaults instead of throwing.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // DJI MSDK v5
    compileOnly "com.dji:dji-sdk-v5-aircraft-provided:5.18.0"
    implementation "com.dji:dji-sdk-v5-aircraft:5.18.0"
    runtimeOnly "com.dji:dji-sdk-v5-networkImp:5.18.0"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Map. Same major version as the v4 app for behavior parity.
    // MapLibre 9.x keeps the com.mapbox.* package names the ported code uses.
    implementation('org.maplibre.gl:android-sdk:9.6.0') {
        exclude group: 'androidx.lifecycle'
        exclude group: 'androidx.fragment'
        exclude group: 'com.google.android.gms'
    }

    // Terrain (DTED) and FAA-ceiling (UASFM) tile indexes.
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
}
